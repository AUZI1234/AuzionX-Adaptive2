name: Research Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  research-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run research tests
        run: python -m unittest discover -s Tests/research -p 'test_*.py' -v
